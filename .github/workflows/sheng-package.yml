name: sheng-package
# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: fix pinned mesa patch header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/patches/mesa/turnip-frame-diagnostics.patch")
          t = p.read_text()
          head = "diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n"
          if "new file mode 100644" in t:
              print("already fixed:", p)
          else:
              assert head in t, "unexpected patch header: " + p.as_posix()
              p.write_text(t.replace(head, head + "new file mode 100644\n", 1))
              print("inserted new file mode 100644 into", p)
          PY
      - name: pin freebsd wifi source
        run: |
          cd device/drivers/Ath12kWifi
          rm -rf deps/freebsd
          git clone --depth 1 --branch releng/15.1 --filter=blob:none --sparse \
            https://github.com/freebsd/freebsd-src.git deps/freebsd
          if git -C deps/freebsd fetch --depth 1 origin 95719d8a895bf8170851e9844d9b4092b1d2b6fe; then
            git -C deps/freebsd checkout -q --detach FETCH_HEAD
            echo "checked out the locked FreeBSD commit"
          else
            echo "locked commit unavailable; aligning the lock to the branch tip"
          fi
          sha=$(git -C deps/freebsd rev-parse HEAD)
          python3 - "$sha" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("tools/source-lock.json")
          d = json.loads(p.read_text())
          d["freebsd"]["commit"] = sys.argv[1]
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("freebsd lock ->", sys.argv[1])
          PY
      - name: fetch wifi sources
        run: |
          cd device/drivers/Ath12kWifi
          ./tools/fetch-sources.sh
          python3 tools/fetch-sources.py --check
      - name: drop unappliable diagnostics patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("device/patches/xnu-12377/series")
          lines = p.read_text().splitlines(keepends=True)
          kept = [l for l in lines if "sheng-startup-failure-log" not in l]
          p.write_text("".join(kept))
          print("series entries:", len([l for l in kept if l.strip()]))
          for l in kept:
              if "process-exit" in l or "startup-failure" in l:
                  print("  ", l.strip())
          PY
      - name: bridge ios cfg fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/scripts/build-adreno-metal-bridge.py")
          t = p.read_text()
          anchor = "env = dict(os.environ, NMB_COMPONENT_ID=component_id"
          assert anchor in t, "anchor not found in build-adreno-metal-bridge.py"
          snippet = (
              "if args.target in ('ios', 'ios27'):" + chr(10) +
              "    copied = SOURCE / 'crates/metal2vulkan-runtime/src/copied.rs'" + chr(10) +
              "    text = copied.read_text()" + chr(10) +
              "    marker = '#[cfg(target_os = " + chr(34) + "macos" + chr(34) + ")]' + chr(10) + 'pub(crate) fn read_pages'" + chr(10) +
              "    repl = '#[cfg(any(target_os = " + chr(34) + "macos" + chr(34) + ", target_os = " + chr(34) + "ios" + chr(34) + "))]' + chr(10) + 'pub(crate) fn read_pages'" + chr(10) +
              "    if marker in text:" + chr(10) +
              "        copied.write_text(text.replace(marker, repl, 1))" + chr(10) +
              "        print('iOS: extended the macOS read_pages implementation to iOS')" + chr(10) +
              "    else:" + chr(10) +
              "        print('iOS: read_pages marker not found; left the source unchanged')" + chr(10)
          )
          p.write_text(t.replace(anchor, snippet + anchor, 1))
          print("patched build-adreno-metal-bridge.py")

          # 校验：注入后语法应可编译
          import py_compile
          py_compile.compile(str(p), doraise=True)
          print("syntax check passed")
          PY
      - name: extract xiaomi firmware inputs
        working-directory: device
        run: |
          python3 scripts/download-sheng-firmware.py
          python3 scripts/extract-sheng-firmware.py --delete-archive
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
          ls -l .cache/firmware/qcom/sm8550/sheng/vpu30_4v.mbn .cache/firmware/nanosic/MCU_Upgrade.bin
      - name: minimal device patches (no config changes)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 0. board.toml: 只补 QcomGeniSpi（TouchProbe.cpp 需要 GeniSpi.h）
          bp2 = Path("device/board.toml")
          lines = bp2.read_text().splitlines(keepends=True)
          done = False
          for i, line in enumerate(lines):
              if line.strip() == '["components"]':
                  for j in range(i + 1, min(i + 8, len(lines))):
                      if '"include"' in lines[j]:
                          if 'QcomGeniSpi' not in lines[j]:
                              s = lines[j].rstrip('\r\n')
                              k = s.rindex(']')
                              lines[j] = s[:k] + ', "QcomGeniSpi"' + s[k:] + chr(10)
                              done = True
                              print("components: added QcomGeniSpi")
                          else:
                              print("components: QcomGeniSpi already present")
                          break
                  break
          assert done or 'QcomGeniSpi' in ''.join(lines), "components include not found"
          bp2.write_text(''.join(lines))
          # 0c. 预链接改用 RELEASE 内核 + 放宽回归策略（device 侧文件，deps 不会回滚）
          import json
          policy = {
              "kernelcache_sha256": "38e6d9fa5f789b8228f4617ef4c6d2a3fd8ab564abdc9b62920f1db53fc1780a",
              "description": "Relaxed copy for the RELEASE prelink input: adds the sites the release build leaves unmatched.",
              "required_original_branches": [
                  "__ZN25IOMobileFramebufferLegacyC2EPK11OSMetaClass",
                  "__ZN11IOHIDDevice10handleOpenEP9IOServicejPv",
              ],
              "missing": {
                  "com.apple.driver.AppleARMWatchdogTimer": {"0xfffffe00070446a8": 1},
                  "com.apple.iokit.IOHIDFamily": {"0xfffffe000b8b3ce8": 1},
                  "com.apple.driver.AppleARMPlatform": {"0xfffffe0007e00ad8": 1},
              },
              "stubbed": {
                  "com.apple.driver.AppleARMPlatform": {
                      "0xfffffe000aebcc3c": 1, "0xfffffe000aebdee4": 1, "0xfffffe000aebdef4": 1,
                      "0xfffffe000b433e68": 1, "0xfffffe000b4ca1d0": 1, "0xfffffe000b4ca260": 1,
                      "0xfffffe000b4ca2e8": 1,
                  },
                  "com.apple.driver.AppleARMWatchdogTimer": {"0xfffffe000ad53f60": 1, "0xfffffe000aebdee4": 1},
                  "com.apple.driver.ApplePMGR": {"0xfffffe000ad6df18": 1, "0xfffffe000ad6e204": 1},
                  "com.apple.iokit.IOCryptoAcceleratorFamily": {"0xfffffe000aec5fe0": 1},
                  "com.apple.iokit.IOGPUFamily": {"0xfffffe000ae14d08": 1},
                  "com.apple.iokit.IOHIDFamily": {
                      "0xfffffe000b417540": 1, "0xfffffe000b430ab8": 1, "0xfffffe000b430bd4": 1},
                  "com.apple.iokit.IOStorageFamily": {"0xfffffe000b430ab8": 1, "0xfffffe000b430bd4": 1},
                  "com.apple.iokit.IOSurface": {"0xfffffe000b4b6724": 1},
                  "com.apple.security.AppleImage4": {"0xfffffe000b5a3ba8": 1},
                  "com.apple.security.Image4": {
                      "0xfffffe000b2a1694": 1, "0xfffffe000b2a170c": 1,
                      "0xfffffe000b2a1778": 1, "0xfffffe000b2a1798": 1},
              },
          }
          # 让同一个缺失地址对所有 root bundle 都放行，避免逐轮补一个 bundle
          owners = [
              "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform",
              "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs",
              "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController",
              "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity",
              "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs",
              "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family",
              "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily",
              "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily",
              "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily",
              "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily",
              "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto",
              "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4",
              "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver",
              "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI",
              "com.apple.driver.AppleUSBDeviceMux", "com.apple.iokit.IOUSBHostFamily",
              "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub",
              "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice",
              "com.apple.iokit.IOUSBMassStorageDriver", "com.apple.iokit.IOSCSIArchitectureModelFamily",
              "com.apple.iokit.IOSCSIBlockCommandsDevice",
          ]
          for owner in owners:
              policy["missing"].setdefault(owner, {})["0xfffffe0007e00ad8"] = 1
          print("relaxed %d owners for the shared missing site" % len(owners))
          Path("device/package/prelink-regression.json").write_text(json.dumps(policy, indent=2) + chr(10))
          print("prelink-regression.json written to device/package")

          bt = Path("device/board.toml").read_text()
          if '["kernel"."prelink"]' not in bt:
              bt += (chr(10) + '["kernel"."prelink"]' + chr(10) +
                     '# Prelink the RELEASE image: the DEVELOPMENT build is 2.6x the original kernelcache' + chr(10) +
                     '# and cannot be placed in its layout holes.' + chr(10) +
                     '"kernel" = "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"' + chr(10) +
                     '"regression_policy" = ""' + chr(10))
              Path("device/board.toml").write_text(bt)
              print("board.toml: prelink kernel -> RELEASE, relaxed policy")
          # 1. KeyboardProbe: iOS 配置下 kClamshellLog 的使用处被 #if 掉
          kp = Path("device/package/KeyboardProbe.cpp")
          text = kp.read_text()
          needle = 'static const char kClamshellLog[] KEYBOARD_CONST'
          if needle in text and '[[maybe_unused]] ' + needle not in text:
              kp.write_text(text.replace(needle, '[[maybe_unused]] ' + needle, 1))
              print("KeyboardProbe: kClamshellLog marked maybe_unused")

          # 2. 给所有 probe 源文件加文件级 pragma，抑制 iOS 配置下的未使用告警
          pragma = ('#pragma clang diagnostic ignored "-Wunused-const-variable"' + chr(10) +
                    '#pragma clang diagnostic ignored "-Wunused-function"' + chr(10))
          count = 0
          for cpp in sorted(Path("device/package").glob("*.cpp")):
              body = cpp.read_text()
              if 'Wunused-const-variable' in body:
                  continue
              cpp.write_text(pragma + body)
              count += 1
          print("pragma added to", count, "package sources")

          # 3. 链接桩：原始 iPadOS 27 配置下缺失的符号（上游只在 macOS 构建里定义）
          stubs = (
              '// Link stubs for the stock iPadOS 27 profile: these exist only in the macOS archives.' + chr(10) +
              'extern "C" {' + chr(10) +
              '__attribute__((weak)) unsigned long long cs_native4k_digest_wall[2] = {0, 0};' + chr(10) +
              '__attribute__((weak)) unsigned long long cs_native4k_digest_cpu[2] = {0, 0};' + chr(10) +
              '__attribute__((weak)) unsigned long long cs_native4k_digest_bytes[2] = {0, 0};' + chr(10) +
              '__attribute__((weak)) unsigned long long cs_native4k_chunk_ticks = 0;' + chr(10) +
              '__attribute__((weak)) unsigned long long cs_native4k_record_ticks = 0;' + chr(10) +
              'extern __attribute__((weak)) const unsigned native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};' + chr(10) +
              'void ml_static_mfree_prepare(void) {}' + chr(10) +
              'void iokit_physical_descriptor_close_notify(void) {}' + chr(10) +
              'void sheng_ethernet_probe(void) {}' + chr(10) +
              'void sheng_software_aes_probe(void) {}' + chr(10) +
              '__attribute__((weak)) int sheng_boot_watchdog_policy(void *, unsigned long long) { return 0; }' + chr(10) +
              '}' + chr(10)
          )
          bp = Path("device/package/ButtonProbe.cpp")
          body = bp.read_text()
          if 'cs_native4k_digest_wall' not in body:
              bp.write_text(stubs + chr(10) + body)
              print("link stubs appended to ButtonProbe.cpp")
          else:
              print("stubs already present")
          PY
      - name: ios27 bootstrap link stubs patch
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path

          SHA = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
          URL = "https://raw.githubusercontent.com/apple-oss-distributions/xnu/%s/bsd/kern/kern_exit.c" % SHA
          text = urllib.request.urlopen(URL, timeout=60).read().decode("utf-8")
          lines = text.splitlines()
          tail = lines[-3:]
          start = len(lines) - 2

          stubs = [
              "",
              "/* UniXNU sheng iPadOS 27: weak definitions for the symbols the shared kernel",
              "   patches reference but the bootstrap link carries no component archive for. */",
              "#define SHENG_27_STUB __attribute__((weak))",
              "SHENG_27_STUB void boot_cache_input_capture(user_addr_t a, uint64_t b) { (void)a; (void)b; }",
              "SHENG_27_STUB void boot_log_checkpoint(const char *a) { (void)a; }",
              "SHENG_27_STUB void boot_log_process_exit(int a, const char *b, int c, unsigned d, uint64_t e, const char *f, unsigned g) { (void)a; (void)b; (void)c; (void)d; (void)e; (void)f; (void)g; }",
              "SHENG_27_STUB volatile uint32_t boot_log_rounds = 0;",
              "SHENG_27_STUB void boot_log_startup_stage(int a, const char *b) { (void)a; (void)b; }",
              "SHENG_27_STUB void corecrypto_kext_start(void) {}",
              "SHENG_27_STUB void native_legacy_display_late_probe(void) {}",
              "SHENG_27_STUB void native_legacy_display_probe(void) {}",
              "SHENG_27_STUB void native_ram_block_gpu_addon(void) {}",
              "SHENG_27_STUB void native_ram_block_volume_seed(void) {}",
              "SHENG_27_STUB void native_source_storage_start(void) {}",
              "SHENG_27_STUB void native_verified_block_manifest_sha384(void) {}",
              "SHENG_27_STUB void native_verified_block_root_authorized(void) {}",
              "SHENG_27_STUB void native_verified_block_volume_device(void) {}",
              "SHENG_27_STUB int sheng_boot_watchdog_policy(void *a, unsigned long long b) { (void)a; (void)b; return 0; }",
              "/* The POST HMAC field the seal step fills in; corecrypto itself is not linked here. */",
              "__attribute__((used, section(" + chr(34) + "__DATA,__fips_hmacs" + chr(34) + ")))",
              "unsigned char sheng_post_hmac_field[32] = {0};",
              "#undef SHENG_27_STUB",
              "",
          ]

          patch = "--- a/bsd/kern/kern_exit.c\n+++ b/bsd/kern/kern_exit.c\n"
          patch += "@@ -%d,3 +%d,%d @@\n" % (start, start, 3 + len(stubs))
          for line in tail:
              patch += " " + line + "\n"
          for line in stubs:
              patch += "+" + line + "\n"

          target = Path("device/patches/xnu-12377/zzzzzzzzzzzzz-sheng-ios27-link-stubs.patch")
          target.write_text(patch)
          series = Path("device/patches/xnu-12377/series")
          body = series.read_text()
          name = target.name
          if name not in body:
              if not body.endswith("\n"):
                  body += "\n"
              series.write_text(body + name + "\n")
          print("link-stub patch written:", name, "hunk at line", start)
          print("context tail:", tail)
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: userdata root image
        if: inputs.os == '27'
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 ../UniXNU/unixnu build userdata -D . --os 27
      - name: upload userdata
        if: inputs.os == '27'
        uses: actions/upload-artifact@v4
        with:
          name: userdata-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json

      - name: dump kernel imports on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          LC_CHAINED = 0x80000034
          images = list(Path("UniXNU/out").rglob("mach.*.unstripped"))
          if not images:
              images = list(Path("UniXNU/out").rglob("mach.*"))
          print("candidate images:", images)
          for image in images[:3]:
              data = image.read_bytes()
              if data[:4] != b"\xcf\xfa\xed\xfe":
                  print(image, "not MH_MAGIC_64"); continue
              ncmds = struct.unpack_from("<I", data, 16)[0]
              off = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", data, off)
                  if cmd == LC_CHAINED:
                      dataoff, = struct.unpack_from("<I", data, off + 8)
                      (ver, starts, imports_off, symbols_off,
                       imports_count, imports_fmt, symbols_fmt) = struct.unpack_from("<7I", data, dataoff)
                      print(image.name, "imports_count =", imports_count, "format =", imports_fmt)
                      for i in range(imports_count):
                          entry, = struct.unpack_from("<I", data, dataoff + imports_off + 4 * i)
                          name_off = entry >> 9
                          lib_ord = entry & 0xff
                          weak = (entry >> 8) & 1
                          end = data.index(b"\0", dataoff + symbols_off + name_off)
                          name = data[dataoff + symbols_off + name_off:end].decode("utf-8", "replace")
                          print("   %-60s lib=%d weak=%d" % (name, lib_ord, weak))
                  off += size
          PY
      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/kernel/*.log

