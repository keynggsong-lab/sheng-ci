name: sheng-package
# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: fix pinned mesa patch header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/patches/mesa/turnip-frame-diagnostics.patch")
          t = p.read_text()
          head = "diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n"
          if "new file mode 100644" in t:
              print("already fixed:", p)
          else:
              assert head in t, "unexpected patch header: " + p.as_posix()
              p.write_text(t.replace(head, head + "new file mode 100644\n", 1))
              print("inserted new file mode 100644 into", p)
          PY
      - name: pin freebsd wifi source
        run: |
          cd device/drivers/Ath12kWifi
          rm -rf deps/freebsd
          git clone --depth 1 --branch releng/15.1 --filter=blob:none --sparse \
            https://github.com/freebsd/freebsd-src.git deps/freebsd
          if git -C deps/freebsd fetch --depth 1 origin 95719d8a895bf8170851e9844d9b4092b1d2b6fe; then
            git -C deps/freebsd checkout -q --detach FETCH_HEAD
            echo "checked out the locked FreeBSD commit"
          else
            echo "locked commit unavailable; aligning the lock to the branch tip"
          fi
          sha=$(git -C deps/freebsd rev-parse HEAD)
          python3 - "$sha" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("tools/source-lock.json")
          d = json.loads(p.read_text())
          d["freebsd"]["commit"] = sys.argv[1]
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("freebsd lock ->", sys.argv[1])
          PY
      - name: fetch wifi sources
        run: |
          cd device/drivers/Ath12kWifi
          ./tools/fetch-sources.sh
          python3 tools/fetch-sources.py --check
      - name: drop unappliable diagnostics patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("device/patches/xnu-12377/series")
          lines = p.read_text().splitlines(keepends=True)
          kept = [l for l in lines if "sheng-startup-failure-log" not in l]
          p.write_text("".join(kept))
          print("series entries:", len([l for l in kept if l.strip()]))
          for l in kept:
              if "process-exit" in l or "startup-failure" in l:
                  print("  ", l.strip())
          PY
      - name: bridge ios cfg fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/scripts/build-adreno-metal-bridge.py")
          t = p.read_text()
          anchor = "env = dict(os.environ, NMB_COMPONENT_ID=component_id"
          assert anchor in t, "anchor not found in build-adreno-metal-bridge.py"
          snippet = (
              "if args.target in ('ios', 'ios27'):" + chr(10) +
              "    copied = SOURCE / 'crates/metal2vulkan-runtime/src/copied.rs'" + chr(10) +
              "    text = copied.read_text()" + chr(10) +
              "    marker = '#[cfg(target_os = " + chr(34) + "macos" + chr(34) + ")]' + chr(10) + 'pub(crate) fn read_pages'" + chr(10) +
              "    repl = '#[cfg(any(target_os = " + chr(34) + "macos" + chr(34) + ", target_os = " + chr(34) + "ios" + chr(34) + "))]' + chr(10) + 'pub(crate) fn read_pages'" + chr(10) +
              "    if marker in text:" + chr(10) +
              "        copied.write_text(text.replace(marker, repl, 1))" + chr(10) +
              "        print('iOS: extended the macOS read_pages implementation to iOS')" + chr(10) +
              "    else:" + chr(10) +
              "        print('iOS: read_pages marker not found; left the source unchanged')" + chr(10)
          )
          p.write_text(t.replace(anchor, snippet + anchor, 1))
          print("patched build-adreno-metal-bridge.py")

          # 校验：注入后语法应可编译
          import py_compile
          py_compile.compile(str(p), doraise=True)
          print("syntax check passed")
          PY
      - name: extract xiaomi firmware inputs
        working-directory: device
        run: |
          python3 scripts/download-sheng-firmware.py
          python3 scripts/extract-sheng-firmware.py --delete-archive
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
          ls -l .cache/firmware/qcom/sm8550/sheng/vpu30_4v.mbn .cache/firmware/nanosic/MCU_Upgrade.bin
      - name: complete components and relax unused-const warning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. board.toml: 把 iPadOS 27 基础组件列表补齐到与 17/26 override 一致
          wanted = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock",
                    "RamBlock", "Adreno740", "AdrenoMetal", "GopFramebuffer", "ShengHidInput",
                    "ShengNovatekTouch", "QcomGeniSpi", "AppleKeyStoreState", "XnuPrelink",
                    "DarwinBoot", "VerifiedRoot", "ShengPreflight", "AirNir", "Ath12kWifi"]
          p = Path("device/board.toml")
          lines = p.read_text().splitlines(keepends=True)
          done = False
          for i, line in enumerate(lines):
              if line.strip() == '["components"]':
                  for j in range(i + 1, min(i + 8, len(lines))):
                      if '"include"' in lines[j]:
                          lines[j] = '"include" = [' + ', '.join('"%s"' % n for n in wanted) + ']\n'
                          done = True
                          break
                  break
          assert done, "components include not found"
          p.write_text(''.join(lines))
          print("components:", len(wanted))

          # 2. 核心脚本: 关掉 unused-const-variable（KeyboardProbe 的 kClamshellLog 在 iOS 配置下被 #if 掉）
          s = Path("UniXNU/scripts/build-sheng-source-drivers.py")
          text = s.read_text()
          flag = "'-Wno-deprecated-enum-enum-conversion'"
          if flag in text and '-Wno-unused-const-variable' not in text:
              s.write_text(text.replace(flag, flag + ", '-Wno-unused-const-variable'", 1))
              print("added -Wno-unused-const-variable")
          else:
              print("flag edit skipped")
          # 3. KeyboardProbe: iOS 配置下 #if 掉 kClamshellLog 的使用处，标记为 maybe_unused
          kp = Path("device/package/KeyboardProbe.cpp")
          text = kp.read_text()
          needle = 'static const char kClamshellLog[] KEYBOARD_CONST'
          if needle in text and '[[maybe_unused]] ' + needle not in text:
              kp.write_text(text.replace(needle, '[[maybe_unused]] ' + needle, 1))
              print("KeyboardProbe: kClamshellLog marked maybe_unused")
          else:
              print("KeyboardProbe: marker present or already patched")
          # 4. 给所有 probe 源文件加文件级 pragma，抑制 iOS 配置下未使用符号的 -Werror
          pragma = ('#pragma clang diagnostic ignored "-Wunused-const-variable"' + chr(10) +
                    '#pragma clang diagnostic ignored "-Wunused-function"' + chr(10))
          count = 0
          for cpp in sorted(Path("device/package").glob("*.cpp")):
              text = cpp.read_text()
              if 'Wunused-const-variable' in text:
                  continue
              cpp.write_text(pragma + text)
              count += 1
          print("pragma added to", count, "package sources")
          # 5. 把 26 profile 的完整归档配方并入 27 profile（27 的列表缺 9 项）
          merged = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace",
                    "component:ArmDTPlatform", "component:ArmCpu",
                    "component:SoftwareAES", "build-software-aes-bindings.py",
                    "component:ShengUfs",
                    "build-sheng-source-storage.py --policy-dir scripts/policies/ipados-27.0.1-24A446",
                    "component:VirtioMmioBlock", "component:RamBlock",
                    "build-mockfs-fixture.py", "build-boot-progress.py",
                    "build-libpthread-kernel.py", "component:Adreno740",
                    "fetch-sheng-dts.py", "fetch-adreno-inputs.py",
                    "prepare-sheng-gmu.py", "prepare-sheng-gpu-smmu.py", "prepare-sheng-gmu-votes.py",
                    "build-adreno740-kits.py", "build-adreno740-accelerator.py",
                    "component:ShengHidInput", "component:AppleKeyStoreState",
                    "build-gop-legacy-display-27.py", "build-fileset-release-reference.py --tree . --lto"]
          lines = p.read_text().splitlines(keepends=True)
          replaced = False
          for i, line in enumerate(lines):
              if '"archives"' in line and not replaced:
                  lines[i] = '"archives" = [' + ', '.join('"%s"' % x for x in merged) + ']\n'
                  replaced = True
                  break
          assert replaced, "kernel archives not found"
          p.write_text(''.join(lines))
          print("archives:", len(merged))
          # 6. 27 profile 链接桩：这些符号只在 macOS 构建里定义，iOS 27 的静态内核链接不允许弱缺失
          stubs = (
              '// Link stubs for the iPadOS 27 build: these symbols exist only in the macOS archives.' + chr(10) +
              'extern "C" {' + chr(10) +
              'unsigned long long cs_native4k_digest_wall[2] = {0, 0};' + chr(10) +
              'unsigned long long cs_native4k_digest_cpu[2] = {0, 0};' + chr(10) +
              'unsigned long long cs_native4k_digest_bytes[2] = {0, 0};' + chr(10) +
              'unsigned long long cs_native4k_chunk_ticks = 0;' + chr(10) +
              'unsigned long long cs_native4k_record_ticks = 0;' + chr(10) +
              'const unsigned native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};' + chr(10) +
              'void ml_static_mfree_prepare(void) {}' + chr(10) +
              'void iokit_physical_descriptor_close_notify(void) {}' + chr(10) +
              'void sheng_ethernet_probe(void) {}' + chr(10) +
              'void sheng_software_aes_probe(void) {}' + chr(10) +
          'int sheng_boot_watchdog_policy(void *, unsigned long long) { return 0; }' + chr(10) +
              '}' + chr(10)
          )
          bp = Path("device/package/ButtonProbe.cpp")
          bt = bp.read_text()
          if 'cs_native4k_digest_wall' not in bt:
              bp.write_text(bt + chr(10) + stubs)
              print("link stubs appended to ButtonProbe.cpp")
          else:
              print("stubs already present")
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: userdata root image
        if: inputs.os == '27'
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 ../UniXNU/unixnu build userdata -D . --os 27
      - name: upload userdata
        if: inputs.os == '27'
        uses: actions/upload-artifact@v4
        with:
          name: userdata-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/kernel/*.log

